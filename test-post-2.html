  function init() {
    const target = document.querySelector(
      ".post-template .content__footer"
    );
    if (!target) return;

    const poems = [
      ["Phantom Step", "/phantom-step.html"],
      ["Gift", "/gift.html"],
      ["Present", "/test-post-2.html"],
      ["Parakeet Dreams", "/parakeet-dreams.html"],
      ["Minotaur", "/minotaur.html"]
    ];

    const current = poems.findIndex(
      p => p[1] === window.location.pathname
    );

    if (current < 0) return;

    const nav = document.createElement("nav");
    nav.className = "poem-nav";
    nav.setAttribute("aria-label", "Poem navigation");

    function makeLink(poem, label, className) {
      const a = document.createElement("a");
      a.href = poem[1];
      a.className = className;

      const small = document.createElement("small");
      small.textContent = label;

      const title = document.createElement("span");
      title.textContent = poem[0];

      a.append(small, title);
      return a;
    }

    if (current > 0) {
      nav.appendChild(
        makeLink(poems[current - 1], "← Previous", "prev")
      );
    } else {
      nav.appendChild(document.createElement("span"));
    }

    const all = document.createElement("a");
    all.href = "/";
    all.className = "all";
    all.textContent = "✦ All poems ✦";
    nav.appendChild(all);

    if (current < poems.length - 1) {
      nav.appendChild(
        makeLink(poems[current + 1], "Next →", "next")
      );
    } else {
      nav.appendChild(document.createElement("span"));
    }

    target.appendChild(nav);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();</script></body></html>
