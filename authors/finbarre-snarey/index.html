  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 16px;
  align-items: center;
  border-top: 1px solid #E2D5E2;
  padding: 24px 0 10px;
  margin: 0 auto;
  max-width: 700px;
  font-family: Georgia, serif;
}

.poem-nav a {
  color: #542B55;
  text-decoration: none;
}

.poem-nav a:hover {
  color: #A77B9D;
  text-decoration: underline;
}

.poem-nav small {
  display: block;
  color: #967A95;
  font: 10px Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 7px;
}

.poem-nav .next {
  text-align: right;
}

.poem-nav .all {
  font-size: 13px;
  text-align: center;
  white-space: nowrap;
}

  margin-top: 40px;

  margin-top: 45px;

@media (max-width: 520px) {
  .poem-nav {
    gap: 10px;
  }
  .poem-nav a {
    font-size: 13px;
  }
  .poem-nav small {
    font-size: 9px;
  }
}</style><script>(function () {
  function init() {
    const target = document.querySelector(
      ".post-template .content__footer"
    );
    if (!target) return;

    const poems = [
      ["Phantom Step", "/phantom-step.html"],
      ["Gift", "/gift.html"],
      ["Present", "/test-post-2.html"],
      ["Parakeet Dreams", "/parakeet-dreams.html"],
      ["Minotaur", "/minotaur.html"]
    ];

    const current = poems.findIndex(
      p => p[1] === window.location.pathname
    );

    if (current < 0) return;

    const nav = document.createElement("nav");
    nav.className = "poem-nav";
    nav.setAttribute("aria-label", "Poem navigation");

    function makeLink(poem, label, className) {
      const a = document.createElement("a");
      a.href = poem[1];
      a.className = className;

      const small = document.createElement("small");
      small.textContent = label;

      const title = document.createElement("span");
      title.textContent = poem[0];

      a.append(small, title);
      return a;
    }

    if (current > 0) {
      nav.appendChild(
        makeLink(poems[current - 1], "← Previous", "prev")
      );
    } else {
      nav.appendChild(document.createElement("span"));
    }

    const all = document.createElement("a");
    all.href = "/";
    all.className = "all";
    all.textContent = "⛧ All poems ⛧";
    nav.appendChild(all);

    if (current < poems.length - 1) {
      nav.appendChild(
        makeLink(poems[current + 1], "Next →", "next")
      );
    } else {
      nav.appendChild(document.createElement("span"));
    }

    target.appendChild(nav);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();</script></body></html>
