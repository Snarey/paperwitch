  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  padding: 25px 0;

}

.poem-navigation a {
  color: #542B55;
  text-decoration: none;
  transition: color .2s ease;
}

.poem-navigation a:hover {
  color: #A77B9D;
}

.poem-navigation .nav-label {
  display: block;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: #9A8099;
  margin-bottom: 7px;
}

.poem-navigation .nav-title {
  display: block;
  font-size: 16px;
  line-height: 1.5;
}

.poem-navigation .nav-all {
  font-size: 13px;
  color: #795878;
  text-align: center;
  white-space: nowrap;
}

  text-align: right;

@media (max-width: 520px) {
  .poem-navigation {

    gap: 20px 12px;

}</style><script>(function () {
  async function addPoemNavigation() {
    const footer = document.querySelector(
      ".post-template .content__footer"
    );
    if (!footer) return;

    try {
      const response = await fetch("/feed.json");
      if (!response.ok) return;

      const feed = await response.json();
      const poems = feed.items.slice().reverse();
      const current = window.location.pathname;

      const index = poems.findIndex(poem =>
        new URL(poem.url, window.location.origin)
          .pathname === current
      );

      if (index === -1) return;

      const nav = document.createElement("nav");
      nav.className = "poem-navigation";
      nav.setAttribute(
        "aria-label",
        "Navigate between poems"
      );

      function link(poem, label, className) {
        const a = document.createElement("a");
        a.href = poem.url;
        a.className = className;

        const small = document.createElement("span");
        small.className = "nav-label";
        small.textContent = label;

        const title = document.createElement("span");
        title.className = "nav-title";
        title.textContent = poem.title;

        a.append(small, title);
        return a;
      }

      if (index > 0) {
        nav.appendChild(link(
          poems[index - 1],
          "← Previous poem",
          "nav-prev"
        ));
      } else {
        nav.appendChild(document.createElement("span"));
      }

      const all = document.createElement("a");
      all.href = "/";
      all.className = "nav-all";
      all.textContent = "✦  All poems  ✦";
      nav.appendChild(all);

      if (index < poems.length - 1) {
        nav.appendChild(link(
          poems[index + 1],
          "Next poem →",
          "nav-next"
        ));
      } else {
        nav.appendChild(document.createElement("span"));
      }

      footer.appendChild(nav);
    } catch (error) {
      console.warn("Poem navigation unavailable", error);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      addPoemNavigation
    );
  } else {
    addPoemNavigation();
  }
})();</script><p style="color: #542B55; text-align: center;">Navigation test</p></body></html>
